<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>漢検4級対策 - まなびやつばめ</title>
    <style>
        :root { --bg-color: #EBF2FF; --btn-green: #4fbe79; --btn-purple: #7c5cc4; --navy-dark: #2c3e50; }
        body { margin: 0; padding: 20px; font-family: 'Noto Sans JP', sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; }
        .app-card { width: 100%; max-width: 540px; background: white; border-radius: 30px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
        .btn-large { width: 100%; padding: 16px; margin: 8px 0; border: none; border-radius: 14px; color: white; font-weight: bold; cursor: pointer; }
        .btn-green { background: var(--btn-green); }
        .btn-purple { background: var(--btn-purple); }
        .hidden { display: none !important; }
        .question-box { font-size: 32px; font-weight: bold; margin: 30px 0; }
        .choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .choice-btn { padding: 20px; border: 2px solid #ddd; border-radius: 15px; cursor: pointer; background: white; }
    </style>
</head>
<body>

<div class="app-card" id="app">
    <div id="view-start">
        <h1>漢検4級対策</h1>
        <button class="btn-large btn-green" onclick="initQuiz('kanji_read')">① 漢字の読み</button>
        <button class="btn-large btn-purple" onclick="initQuiz('kanji_write')">② 漢字の書取</button>
        <button class="btn-large btn-green" onclick="initQuiz('yoji_read')">③ 四字熟語の読み</button>
        <button class="btn-large btn-purple" onclick="initQuiz('yoji_write')">④ 四字熟語の書取</button>
    </div>

    <div id="view-quiz" class="hidden">
        <div id="progress">1 / 20</div>
        <div class="question-box" id="question-text"></div>
        <div class="choices-grid" id="choices"></div>
    </div>
</div>

<script>
    let db = { kanji: [], yoji: [] };
    let currentPool = [];
    let qIdx = 0, score = 0;

    // CSV読み込み
    async function loadAll() {
        const kRes = await fetch('kanken4kyu_kanji.csv');
        db.kanji = (await kRes.text()).split('\n').slice(1).filter(l=>l).map(l => {
            const [q, a1, a2] = l.split(',');
            return { q, a: a1, d: [a2, "読み方A", "読み方B", "読み方C"] };
        });
        const yRes = await fetch('kanken4kyu_yojijukugo.csv');
        db.yoji = (await yRes.text()).split('\n').slice(1).filter(l=>l).map(l => {
            const [q, r, m, t] = l.split(',');
            return { q, a: r, d: [m, "熟語A", "熟語B", "熟語C"] };
        });
        console.log("データ読み込み完了:", db);
    }

    function initQuiz(type) {
        let pool = type.includes('kanji') ? db.kanji : db.yoji;
        currentPool = pool.sort(() => Math.random() - 0.5).slice(0, 20);
        qIdx = 0; score = 0;
        document.getElementById('view-start').classList.add('hidden');
        document.getElementById('view-quiz').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        const q = currentPool[qIdx];
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('progress').innerText = `${qIdx + 1} / 20`;
        const container = document.getElementById('choices');
        container.innerHTML = '';
        [q.a, ...q.d.slice(0,3)].sort(() => Math.random() - 0.5).forEach(text => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = text;
            btn.onclick = () => { qIdx++; qIdx < 20 ? showQuestion() : alert('終了！スコア:' + score); };
            container.appendChild(btn);
        });
    }

    loadAll();
</script>
</body>
</html>

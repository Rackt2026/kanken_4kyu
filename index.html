<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>漢検4級チャレンジ！ - まなびやつばめ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eaf4ff;
      --bg2: #fff8d8;
      --card: #ffffff;
      --yellow: #ffd93d;
      --yellow-dark: #e3bd19;
      --blue: #7cc7ff;
      --blue-dark: #4aa2df;
      --purple: #9472e8;
      --purple-dark: #7452c6;
      --green: #45c486;
      --red: #ff6b6b;
      --navy: #26374a;
      --muted: #748091;
      --line: #dce8f5;
      --soft: #f6faff;
      --shadow: 0 16px 36px rgba(38, 55, 74, 0.12);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Noto Sans JP", sans-serif;
      color: var(--navy);
      background:
        radial-gradient(circle at 16% 12%, rgba(255, 217, 61, 0.55), transparent 25%),
        radial-gradient(circle at 88% 8%, rgba(124, 199, 255, 0.55), transparent 28%),
        linear-gradient(145deg, var(--bg), var(--bg2));
    }

    body {
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button {
      font-family: inherit;
    }

    .app {
      width: 100%;
      max-width: 460px;
      min-height: min(720px, calc(100vh - 24px));
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 30px;
      box-shadow: var(--shadow);
      padding: 18px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: -80px auto auto -80px;
      width: 190px;
      height: 190px;
      background: rgba(255, 217, 61, 0.22);
      border-radius: 50%;
      pointer-events: none;
    }

    .view {
      position: relative;
      z-index: 1;
      display: none;
      flex: 1;
      flex-direction: column;
    }

    .view.active {
      display: flex;
    }

    .logo-area {
      text-align: center;
      padding-top: 4px;
    }

    .logo-link {
      display: inline-block;
      border-radius: 50%;
      transition: transform 0.12s ease;
    }

    .logo-link:active {
      transform: translateY(3px) scale(0.98);
    }

    .logo {
      width: 82px;
      height: 82px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid var(--yellow);
      background: white;
      box-shadow: 0 8px 18px rgba(38, 55, 74, 0.12);
    }

    h1 {
      margin: 8px 0 4px;
      text-align: center;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: clamp(24px, 6vw, 30px);
      line-height: 1.15;
      letter-spacing: 0.02em;
    }

    .sub-copy {
      margin: 0 auto 14px;
      text-align: center;
      color: var(--muted);
      font-weight: 700;
      font-size: 13px;
      line-height: 1.6;
    }

    .notice {
      background: #fffdf0;
      border: 2px solid #ffe986;
      border-radius: 18px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.55;
      color: #6c5900;
      margin-bottom: 12px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: auto;
    }

    .btn {
      border: none;
      border-radius: 18px;
      padding: 15px 8px;
      min-height: 58px;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-weight: 900;
      font-size: 14px;
      line-height: 1.25;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.12s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      user-select: none;
    }

    .btn:active, .choice-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.12) !important;
      filter: brightness(0.98);
    }

    .btn-yellow {
      background: var(--yellow);
      color: #574900;
      box-shadow: 0 6px 0 var(--yellow-dark);
    }

    .btn-blue {
      background: var(--blue);
      color: #08314c;
      box-shadow: 0 6px 0 var(--blue-dark);
    }

    .btn-purple {
      background: var(--purple);
      color: white;
      box-shadow: 0 6px 0 var(--purple-dark);
    }

    .btn-gray {
      background: #97a6b7;
      color: white;
      box-shadow: 0 5px 0 #6f7f90;
    }

    .status-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: center;
      background: var(--soft);
      border: 2px solid var(--line);
      border-radius: 18px;
      padding: 9px 12px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .status-center {
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 17px;
      color: var(--navy);
    }

    .status-left { color: var(--red); }
    .status-right { color: var(--blue-dark); text-align: right; }

    .q-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      align-self: flex-start;
      background: #fff4bf;
      border: 2px solid #ffe172;
      color: #6a5700;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .q-box {
      flex: 0 0 auto;
      min-height: 116px;
      background: #f8fbff;
      border: 3px dashed #bfd7ef;
      border-radius: 24px;
      padding: 18px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 900;
      font-size: clamp(25px, 8vw, 38px);
      line-height: 1.28;
      word-break: keep-all;
      overflow-wrap: anywhere;
      margin-bottom: 12px;
    }

    .q-box.small {
      font-size: clamp(18px, 5.2vw, 25px);
      text-align: left;
      justify-content: flex-start;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.45;
      margin: -4px 2px 10px;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: auto;
    }

    .choice-btn {
      min-height: 62px;
      border: 2px solid #dce8f5;
      background: white;
      color: var(--navy);
      border-radius: 18px;
      padding: 12px 8px;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.28;
      cursor: pointer;
      box-shadow: 0 5px 0 #d5e1ee;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.12s ease;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .choice-btn.locked {
      pointer-events: none;
    }

    .choice-btn.correct-choice {
      background: #fff1f1;
      border-color: var(--red);
      color: #c63434;
    }

    .choice-btn.wrong-choice {
      background: #eef7ff;
      border-color: var(--blue-dark);
      color: #286b9c;
    }

    .home-btn {
      width: 100%;
      min-height: 45px;
      margin-top: 14px;
      padding: 10px;
      font-size: 13px;
    }

    .result-main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      flex: 1;
      padding: 8px 0;
    }

    .result-badge {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 38%, #fff2aa 39%, #ffd93d 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 46px;
      font-weight: 900;
      color: #6a5700;
      box-shadow: 0 12px 24px rgba(38, 55, 74, 0.12);
      margin: 12px 0 18px;
    }

    .result-comment {
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 19px;
      font-weight: 900;
      color: var(--purple);
      line-height: 1.6;
      margin: 0 0 18px;
    }

    .result-detail {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .effect-layer {
      position: absolute;
      left: 50%;
      top: 43%;
      transform: translate(-50%, -50%) scale(0);
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: 150px;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 8px 24px rgba(38, 55, 74, 0.16);
    }

    .effect-layer.pop {
      animation: pop 0.62s cubic-bezier(.17,.89,.32,1.28) forwards;
    }

    @keyframes pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0); }
      38% { opacity: 1; transform: translate(-50%, -50%) scale(1.18); }
      78% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.78); }
    }

    .loading-error {
      color: #d44343 !important;
    }

    @media (max-height: 670px) {
      body { padding: 8px; }
      .app { border-radius: 24px; padding: 14px; min-height: calc(100vh - 16px); }
      .logo { width: 62px; height: 62px; }
      h1 { font-size: 23px; margin-top: 5px; }
      .sub-copy { font-size: 12px; margin-bottom: 8px; }
      .notice { display: none; }
      .btn { min-height: 50px; padding: 11px 6px; font-size: 13px; }
      .q-box { min-height: 94px; padding: 13px 12px; margin-bottom: 9px; }
      .choice-btn { min-height: 54px; padding: 9px 6px; font-size: 14px; }
      .home-btn { min-height: 40px; margin-top: 10px; }
      .status-bar { padding: 7px 10px; margin-bottom: 8px; }
    }
  </style>
</head>
<body>
  <main class="app" aria-live="polite">
    <div id="effectLayer" class="effect-layer"></div>

    <section id="startView" class="view active">
      <div class="logo-area">
        <a class="logo-link" href="https://manabiya-tsubame.com/" target="_blank" rel="noopener noreferrer" aria-label="まなびやつばめ公式HPを開く">
          <img src="rogo.png" class="logo" alt="まなびやつばめロゴ" onerror="this.style.display='none'" />
        </a>
      </div>

      <h1>漢検4級チャレンジ</h1>
      <p id="loadingStatus" class="sub-copy">データをよみこみ中...</p>

      <div class="notice">
        6つのメニューからえらんで、20問にチャレンジ。<br />
        正解すると「〇」、まちがえると「×」が出ます。
      </div>

      <div class="menu-grid">
        <button class="btn btn-yellow" data-cat="reading">① 漢字の読み</button>
        <button class="btn btn-blue" data-cat="writing">② 漢字の書取</button>
        <button class="btn btn-yellow" data-cat="yojiReading">③ 四字熟語読み</button>
        <button class="btn btn-blue" data-cat="yojiWriting">④ 四字熟語書取</button>
        <button class="btn btn-yellow" data-cat="synonym">⑤ 対義・類義語</button>
        <button class="btn btn-blue" data-cat="bushu">⑥ 部首・部首名</button>
      </div>
    </section>

    <section id="quizView" class="view">
      <div class="status-bar">
        <div class="status-left">〇 <span id="okCount">0</span></div>
        <div id="progress" class="status-center">1 / 20</div>
        <div class="status-right">× <span id="ngCount">0</span></div>
      </div>

      <div id="categoryLabel" class="q-label">モンダイ</div>
      <div id="questionBox" class="q-box">---</div>
      <div id="hintText" class="hint"></div>
      <div id="choicesArea" class="choices"></div>
      <button class="btn btn-gray home-btn" id="homeBtn">トップにもどる</button>
    </section>

    <section id="resultView" class="view">
      <h1>結果発表！</h1>
      <div class="result-main">
        <div class="result-badge"><span id="finalScore">0</span></div>
        <p id="resultComment" class="result-comment">よくがんばりました！</p>
        <p id="resultDetail" class="result-detail"></p>
        <button class="btn btn-yellow" id="retryBtn" style="width:100%;">もういちど遊ぶ</button>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    const TOTAL_QUESTIONS = 20;

    const state = {
      kanji: [],
      yoji: [],
      loaded: false,
      questions: [],
      index: 0,
      ok: 0,
      ng: 0,
      locked: false,
      lastCategory: null,
      audioCtx: null
    };

    const el = {
      startView: document.getElementById("startView"),
      quizView: document.getElementById("quizView"),
      resultView: document.getElementById("resultView"),
      loadingStatus: document.getElementById("loadingStatus"),
      okCount: document.getElementById("okCount"),
      ngCount: document.getElementById("ngCount"),
      progress: document.getElementById("progress"),
      categoryLabel: document.getElementById("categoryLabel"),
      questionBox: document.getElementById("questionBox"),
      hintText: document.getElementById("hintText"),
      choicesArea: document.getElementById("choicesArea"),
      effectLayer: document.getElementById("effectLayer"),
      finalScore: document.getElementById("finalScore"),
      resultComment: document.getElementById("resultComment"),
      resultDetail: document.getElementById("resultDetail"),
      homeBtn: document.getElementById("homeBtn"),
      retryBtn: document.getElementById("retryBtn")
    };

    const labels = {
      reading: "正しい読み方をえらぼう",
      writing: "読み方に合う漢字をえらぼう",
      yojiReading: "四字熟語の読み方をえらぼう",
      yojiWriting: "意味に合う四字熟語をえらぼう",
      synonym: "近い意味・反対の意味を考えよう",
      bushu: "部首名をえらぼう"
    };

    // CSVに対義語・類義語の専用列がない場合でも遊べるように、主要語を内蔵。
    // CSVに「類義語」「対義語」列があれば、そちらを優先して使う。
    const fallbackSynPairs = [
      { q: "安全", a: "危険", kind: "反対の意味" },
      { q: "原因", a: "結果", kind: "反対・対応する意味" },
      { q: "増加", a: "減少", kind: "反対の意味" },
      { q: "成功", a: "失敗", kind: "反対の意味" },

      { q: "容易", a: "困難", kind: "反対の意味" },

      { q: "豊富", a: "不足", kind: "反対の意味" },
      { q: "偶然", a: "必然", kind: "反対の意味" },
      { q: "過去", a: "未来", kind: "反対の意味" },
      { q: "具体", a: "抽象", kind: "反対の意味" },
      { q: "温暖", a: "寒冷", kind: "反対の意味" },
      { q: "需要", a: "供給", kind: "対応する意味" },
      { q: "独立", a: "依存", kind: "反対の意味" },

      { q: "理由", a: "原因", kind: "近い意味" },
      { q: "方法", a: "手段", kind: "近い意味" },
      { q: "完成", a: "完了", kind: "近い意味" },
      { q: "理解", a: "納得", kind: "近い意味" },
      { q: "予想", a: "予測", kind: "近い意味" },
      { q: "協力", a: "助力", kind: "近い意味" },
      { q: "確認", a: "点検", kind: "近い意味" },
      { q: "判断", a: "決定", kind: "近い意味" }
    ];

    // 主要漢字の部首マップ。CSV側に部首列がある場合はCSVを優先。

    }

    function parseCSV(text) {
      const lines = String(text || "").split(/\r?\n/).filter(line => line.trim() !== "");
      if (!lines.length) return [];

      const first = splitCSVLine(lines[0]);
      const hasHeader = first.some(cell => /漢字|読み|よみ|四字|意味|部首|類義|対義|問題|答え|answer|question/i.test(cell));
      const headers = hasHeader ? first : [];
      const body = hasHeader ? lines.slice(1) : lines;

      return body.map(line => {
        const cells = splitCSVLine(line);
        const row = { raw: cells };
        headers.forEach((h, i) => row[h] = cells[i] || "");
        return row;
      }).filter(row => row.raw.some(Boolean));
    }

    function getField(row, candidates, fallbackIndex = 0) {
      for (const key of Object.keys(row)) {
        if (key === "raw") continue;
        if (candidates.some(c => key.toLowerCase().includes(c.toLowerCase()))) return normalizeText(row[key]);
      }
      return normalizeText(row.raw[fallbackIndex] || "");
    }

    function kanjiWord(row) {
      return getField(row, ["漢字", "問題", "kanji", "word", "熟語"], 0);
    }

    function kanjiReading(row) {
      return getField(row, ["読み", "よみ", "かな", "reading", "answer"], 1);
    }

    function yojiWord(row) {
      return getField(row, ["四字", "熟語", "漢字", "word"], 0);
    }

    function yojiReading(row) {
      return getField(row, ["読み", "よみ", "かな", "reading"], 1);
    }

    function yojiMeaning(row) {
      return getField(row, ["意味", "説明", "内容", "description", "mean"], 2);
    }

    function rowBushu(row) {
      return getField(row, ["部首名", "部首", "bushu"], 2);
    }

    function rowSynonym(row) {
      return getField(row, ["類義", "類語", "近い"], 3);
    }

    function rowAntonym(row) {
      return getField(row, ["対義", "反対"], 4);
    }

    async function loadCSVData() {
      try {
        const [kanjiRes, yojiRes] = await Promise.all([
          fetch("kanken4kyu_kanji.csv", { cache: "no-store" }),
          fetch("kanken4kyu_yojijukugo.csv", { cache: "no-store" })
        ]);

        if (!kanjiRes.ok) throw new Error("kanken4kyu_kanji.csv が読み込めません");
        if (!yojiRes.ok) throw new Error("kanken4kyu_yojijukugo.csv が読み込めません");

        const [kanjiText, yojiText] = await Promise.all([kanjiRes.text(), yojiRes.text()]);
        state.kanji = parseCSV(kanjiText).filter(row => kanjiWord(row) && kanjiReading(row));
        state.yoji = parseCSV(yojiText).filter(row => yojiWord(row) && yojiReading(row));

        if (state.kanji.length < 4 || state.yoji.length < 4) {
          throw new Error("CSVのデータ数が少なすぎます");
        }

        state.loaded = true;
        el.loadingStatus.textContent = `データOK：漢字 ${state.kanji.length}件／四字熟語 ${state.yoji.length}件`;
        el.loadingStatus.classList.remove("loading-error");
      } catch (error) {
        state.loaded = false;
        el.loadingStatus.textContent = "データ読み込みに失敗しました。CSV名と同じフォルダ配置を確認してください。";
        el.loadingStatus.classList.add("loading-error");
        console.error(error);
      }
    }

    function initAudio() {
      try {
        if (!state.audioCtx) state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (state.audioCtx.state === "suspended") state.audioCtx.resume();
      } catch (e) {
        state.audioCtx = null;
      }
    }

    function playTone(sequence, type = "sine") {
      if (!state.audioCtx) return;
      const ctx = state.audioCtx;
      const now = ctx.currentTime;

      sequence.forEach((item, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(item.freq, now + item.start);
        gain.gain.setValueAtTime(0.0001, now + item.start);
        gain.gain.exponentialRampToValueAtTime(item.volume || 0.08, now + item.start + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + item.start + item.duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + item.start);
        osc.stop(now + item.start + item.duration + 0.02);
      });
    }

    function playCorrect() {
      playTone([
        { freq: 523.25, start: 0, duration: 0.11 },
        { freq: 659.25, start: 0.09, duration: 0.11 },
        { freq: 783.99, start: 0.18, duration: 0.11 },
        { freq: 1046.50, start: 0.27, duration: 0.16, volume: 0.09 }
      ], "sine");
    }

    function playWrong() {
      playTone([
        { freq: 180, start: 0, duration: 0.16, volume: 0.09 },
        { freq: 135, start: 0.12, duration: 0.20, volume: 0.08 }
      ], "sawtooth");
    }

    function shuffle(array) {
      const a = [...array];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function sample(array, count) {
      return shuffle(array).slice(0, count);
    }

    function unique(array) {
      return Array.from(new Set(array.map(v => normalizeText(v)).filter(Boolean)));
    }

    function stripParen(text) {
      return normalizeText(text).replace(/[（(].*?[）)]/g, "").trim();
    }

    function addDummies(correct, candidates, targetCount = 4) {
      const result = [correct];
      for (const c of candidates) {
        if (result.length >= targetCount) break;
        if (c && c !== correct && !result.includes(c)) result.push(c);
      }
      return shuffle(result).slice(0, targetCount);
    }

    function similarReadDummies(correct, pool) {
      const c = stripParen(correct);
      const first = c.slice(0, 1);
      const last = c.slice(-1);
      const len = c.length;

      const scored = unique(pool).filter(x => x !== correct).map(x => {
        const s = stripParen(x);
        let score = 0;
        if (s[0] === first) score += 3;
        if (s.slice(-1) === last) score += 2;
        if (Math.abs(s.length - len) <= 1) score += 1;
        if (s.slice(0, 2) === c.slice(0, 2)) score += 3;
        return { x, score };
      }).sort((a, b) => b.score - a.score || Math.random() - 0.5).map(o => o.x);

      return scored;
    }

    function similarKanjiDummies(correct, pool) {
      const chars = [...correct];
      const scored = unique(pool).filter(x => x !== correct).map(x => {
        let score = 0;
        for (const ch of chars) if (x.includes(ch)) score += 3;
        if ([...x].length === chars.length) score += 1;
        if (x[0] === correct[0]) score += 2;
        return { x, score };
      }).sort((a, b) => b.score - a.score || Math.random() - 0.5).map(o => o.x);

      return scored;
    }

    function fakeYojiDummies(correct, yojiPool) {
      const chars = [...correct];
      const realSimilar = similarKanjiDummies(correct, yojiPool);
      const replaceChars = unique(yojiPool.join("").split("")).filter(ch => !chars.includes(ch));
      const fakes = [];

      for (let i = 0; i < 20 && fakes.length < 8; i++) {
        const pos = Math.floor(Math.random() * chars.length);
        const repl = replaceChars[Math.floor(Math.random() * replaceChars.length)] || "心";
        const copy = [...chars];
        copy[pos] = repl;
        const fake = copy.join("");
        if (fake !== correct && !fakes.includes(fake)) fakes.push(fake);
      }

      return unique([...realSimilar, ...fakes]);
    }

    function makeReadingQuestion(row) {
      const q = kanjiWord(row);
      const a = kanjiReading(row);
      const pool = state.kanji.map(kanjiReading);
      return {
        q,
        a,
        label: labels.reading,
        hint: "音読み・訓読みをよく見てえらびましょう。",
        choices: addDummies(a, similarReadDummies(a, pool))
      };
    }

    function makeWritingQuestion(row) {
      const q = kanjiReading(row);
      const a = kanjiWord(row);
      const pool = state.kanji.map(kanjiWord);
      return {
        q,
        a,
        label: labels.writing,
        hint: "読み方から、正しい漢字をえらびましょう。",
        choices: addDummies(a, similarKanjiDummies(a, pool))
      };
    }

    function makeYojiReadingQuestion(row) {
      const q = yojiWord(row);
      const a = yojiReading(row);
      const pool = state.yoji.map(yojiReading);
      return {
        q,
        a,
        label: labels.yojiReading,
        hint: "四字熟語は、漢字の並びと読み方をセットで覚えましょう。",
        choices: addDummies(a, similarReadDummies(a, pool))
      };
    }

    function makeYojiWritingQuestion(row) {
      const q = yojiMeaning(row) || `「${yojiReading(row)}」と読む四字熟語はどれ？`;
      const a = yojiWord(row);
      const pool = state.yoji.map(yojiWord);
      return {
        q,
        a,
        label: labels.yojiWriting,
        hint: "意味を読んで、いちばん合う四字熟語をえらびましょう。",
        choices: addDummies(a, fakeYojiDummies(a, pool)),
        small: true
      };
    }

    function makeSynonymPoolFromCSV() {
      const pairs = [];
      state.kanji.forEach(row => {
        const base = kanjiWord(row);
        const syn = rowSynonym(row);
        const ant = rowAntonym(row);
        if (base && syn) pairs.push({ q: base, a: syn, kind: "近い意味" });
        if (base && ant) pairs.push({ q: base, a: ant, kind: "反対の意味" });
      });
      return pairs;
    }

    function makeSynonymQuestion(pair, allPairs) {
      const correct = pair.a;
      const pool = unique([...allPairs.map(p => p.q), ...allPairs.map(p => p.a), ...state.kanji.map(kanjiWord)]);
      const candidates = similarKanjiDummies(correct, pool);
      return {
        q: `「${pair.q}」と${pair.kind}の言葉はどれ？`,
        a: correct,
        label: labels.synonym,
        hint: "言葉の意味のつながりを考えてえらびましょう。",
        choices: addDummies(correct, candidates),
        small: true
      };
    }

    function makeBushuQuestion(row) {
      const q = kanjiWord(row).slice(0, 1);
      const csvBushu = rowBushu(row);
      const a = csvBushu || bushuMap[q];
      const candidates = bushuChoices.filter(x => x !== a);
      return {
        q,
        a,
        label: labels.bushu,
        hint: `漢字「${q}」の部首名をえらびましょう。`,
        choices: addDummies(a, sample(candidates, 12))
      };
    }

    function generateQuestions(category) {
      let rows = [];
      let questions = [];

      if (category === "reading") {
        rows = sample(state.kanji, TOTAL_QUESTIONS);
        questions = rows.map(makeReadingQuestion);
      }

      if (category === "writing") {
        rows = sample(state.kanji, TOTAL_QUESTIONS);
        questions = rows.map(makeWritingQuestion);
      }

      if (category === "yojiReading") {
        rows = sample(state.yoji, TOTAL_QUESTIONS);
        questions = rows.map(makeYojiReadingQuestion);
      }

      if (category === "yojiWriting") {
        rows = sample(state.yoji.filter(r => yojiMeaning(r)), TOTAL_QUESTIONS);
        if (rows.length < TOTAL_QUESTIONS) rows = sample(state.yoji, TOTAL_QUESTIONS);
        questions = rows.map(makeYojiWritingQuestion);
      }

      if (category === "synonym") {
        const csvPairs = makeSynonymPoolFromCSV();
        const allPairs = csvPairs.length >= 8 ? csvPairs : fallbackSynPairs;
        rows = sample(allPairs, TOTAL_QUESTIONS);
        questions = rows.map(pair => makeSynonymQuestion(pair, allPairs));
      }

      if (category === "bushu") {
        const usable = state.kanji.filter(row => {
          const k = kanjiWord(row).slice(0, 1);
          return (rowBushu(row) || bushuMap[k]) && /^[一-龯々]$/.test(k);
        });
        rows = sample(usable, TOTAL_QUESTIONS);
        questions = rows.map(makeBushuQuestion);
      }

      if (!questions.length) {
        alert("このカテゴリーの問題が作れませんでした。CSVの列やデータを確認してください。");
        return [];
      }

      while (questions.length < TOTAL_QUESTIONS) {
        questions.push(...sample(questions, Math.min(questions.length, TOTAL_QUESTIONS - questions.length)));
      }

      return questions.slice(0, TOTAL_QUESTIONS).map(q => ({
        ...q,
        choices: q.choices.length === 4 ? q.choices : addDummies(q.a, unique([...q.choices, ...state.kanji.map(kanjiWord), ...state.yoji.map(yojiWord), ...bushuChoices]))
      }));
    }

    function setView(name) {
      [el.startView, el.quizView, el.resultView].forEach(v => v.classList.remove("active"));
      if (name === "start") el.startView.classList.add("active");
      if (name === "quiz") el.quizView.classList.add("active");
      if (name === "result") el.resultView.classList.add("active");
    }

    function startQuiz(category) {
      initAudio();
      if (!state.loaded) {
        alert("データを読み込み中、または読み込みに失敗しています。CSVの配置を確認してください。");
        return;
      }

      const questions = generateQuestions(category);
      if (!questions.length) return;

      state.lastCategory = category;
      state.questions = questions;
      state.index = 0;
      state.ok = 0;
      state.ng = 0;
      state.locked = false;
      setView("quiz");
      showQuestion();
    }

    function showQuestion() {
      const data = state.questions[state.index];
      state.locked = false;

      el.okCount.textContent = state.ok;
      el.ngCount.textContent = state.ng;
      el.progress.textContent = `${state.index + 1} / ${TOTAL_QUESTIONS}`;
      el.categoryLabel.textContent = data.label;
      el.questionBox.textContent = data.q;
      el.questionBox.classList.toggle("small", !!data.small || String(data.q).length > 18);
      el.hintText.textContent = data.hint || "";
      el.choicesArea.innerHTML = "";

      data.choices.forEach(choice => {
        const button = document.createElement("button");
        button.className = "choice-btn";
        button.type = "button";
        button.textContent = choice;
        button.addEventListener("click", () => checkAnswer(choice));
        el.choicesArea.appendChild(button);
      });
    }

    function showEffect(isCorrect) {
      el.effectLayer.textContent =

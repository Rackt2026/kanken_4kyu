<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢検4級対策問題 - まなびやつばめ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #EBF2FF;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --btn-green: #4fbe79;
            --btn-green-shadow: #3e9e63;
            --btn-purple: #7c5cc4;
            --btn-purple-shadow: #6347a3;
            --navy-dark: #2c3e50;
            --status-bg: #272f3d;
            --text-main: #2c3e50;
            --choice-border: #eef2f6;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* アプリ外枠（カードスタイル） */
        .app-card {
            width: 100%;
            max-width: 540px;
            min-height: 600px;
            background: #ffffff;
            border-radius: 30px;
            box-shadow: var(--card-shadow);
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* ロゴ部分 */
        .logo-box {
            margin-bottom: 25px;
            text-align: center;
        }
        .logo-box img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* タイトルテキスト */
        .title-main {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 28px;
            color: var(--navy-dark);
            margin: 0 0 5px 0;
            text-align: center;
        }
        .subtitle {
            font-size: 24px;
            color: var(--navy-dark);
            margin: 0 0 10px 0;
            font-weight: bold;
            text-align: center;
        }
        .info-text {
            color: #7f8c8d;
            font-size: 15px;
            margin: 0 0 25px 0;
            text-align: center;
        }

        /* メニューボタン（縦一列・交互カラー） */
        .menu-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-large {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.1s;
            text-align: center;
        }
        .btn-large:disabled {
            background: #ccc !important;
            box-shadow: 0 4px 0 #999 !important;
            cursor: not-allowed;
        }
        .btn-green {
            background: var(--btn-green);
            box-shadow: 0 4px 0 var(--btn-green-shadow);
        }
        .btn-purple {
            background: var(--btn-purple);
            box-shadow: 0 4px 0 var(--btn-purple-shadow);
        }
        .btn-large:not(:disabled):active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.2);
        }

        /* クイズ画面：正解・ミス ステータスバー */
        .status-bar {
            width: 100%;
            background: var(--status-bg);
            color: white;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            justify-content: space-around;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .status-bar .correct-count { color: #ffffff; }
        .status-bar .miss-count { color: #ff9f9f; }

        .progress-text {
            font-size: 15px;
            color: #99aab5;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* 出題テキスト */
        .question-box {
            font-size: 38px;
            font-weight: bold;
            color: #1c2d42;
            margin: 30px 0;
            text-align: center;
            width: 100%;
            word-break: break-all;
            line-height: 1.4;
        }

        /* 2x2 解答グリッド */
        .choices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            margin-top: auto;
        }
        .choice-btn {
            background: white;
            border: 2px solid var(--choice-border);
            border-radius: 16px;
            padding: 22px 10px;
            font-size: 20px;
            font-weight: bold;
            color: #34495e;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 4px 0 var(--choice-border);
            text-align: center;
        }
        .choice-btn:hover {
            background: #f8faff;
            border-color: #cbd5e0;
        }

        /* 正誤フィードバック表示（背景変化） */
        .choice-btn.correct-ans {
            background: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724 !important;
            box-shadow: 0 4px 0 #1e7e34 !important;
        }
        .choice-btn.incorrect-ans {
            background: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24 !important;
            box-shadow: 0 4px 0 #bd2130 !important;
        }

        .hidden { display: none !important; }

        .result-score {
            font-size: 56px;
            font-weight: bold;
            color: var(--btn-purple);
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="app-card">
        <div id="view-start" class="view" style="width: 100%;">
            <div class="logo-box">
                <a href="https://manabiya-tsubame.com/" target="_blank">
                    <img src="rogo.png" alt="まなびやつばめ">
                </a>
            </div>
            <h1 class="title-main">漢検4級対策</h1>
            <p class="subtitle">20問チャレンジ！</p>
            <p class="info-text" id="load-status">データを読み込んでいます...</p>
            
            <div class="menu-list">
                <button class="btn-large btn-green" id="btn-cat-1" onclick="initQuiz(1)" disabled>① 漢字の読み</button>
                <button class="btn-large btn-purple" id="btn-cat-2" onclick="initQuiz(2)" disabled>② 漢字の書取</button>
                <button class="btn-large btn-green" id="btn-cat-3" onclick="initQuiz(3)" disabled>③ 四字熟語の読み</button>
                <button class="btn-large btn-purple" id="btn-cat-4" onclick="initQuiz(4)" disabled>④ 四字熟語の書取</button>
                <button class="btn-large btn-green" id="btn-cat-5" onclick="initQuiz(5)" disabled>⑤ 対義語・類義語</button>
                <button class="btn-large btn-purple" id="btn-cat-6" onclick="initQuiz(6)" disabled>⑥ 部首・部首名</button>
            </div>
        </div>

        <div id="view-quiz" class="view hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center; height: 100%;">
            <div class="status-bar">
                <div>正解：<span id="score-correct" class="correct-count">0</span></div>
                <div>ミス：<span id="score-miss" class="miss-count">0</span></div>
            </div>
            
            <div class="progress-text"><span id="current-idx">1</span> / 20</div>
            <div class="question-box" id="question-text">漢字</div>

            <div class="choices-grid">
                <button class="choice-btn" id="choice-0" onclick="checkAnswer(0)"></button>
                <button class="choice-btn" id="choice-1" onclick="checkAnswer(1)"></button>
                <button class="choice-btn" id="choice-2" onclick="checkAnswer(2)"></button>
                <button class="choice-btn" id="choice-3" onclick="checkAnswer(3)"></button>
            </div>
        </div>

        <div id="view-result" class="view hidden" style="text-align: center; width: 100%;">
            <h1 class="title-main">おつかれさまでした！</h1>
            <div class="result-score"><span id="final-score">0</span> / 20</div>
            <p class="info-text" id="result-comment">よくがんばったね！</p>
            <button class="btn-large btn-green" onclick="backToMenu()">トップにもどる</button>
        </div>
    </div>

    <script>
        // 🚨 以下のURLを、ご自身のGitHubの「Raw」ボタンからコピーしたURLに必ず書き換えてください。
        const GITHUB_KANJI_JSON_URL = 'https://raw.githubusercontent.com/あなたのユーザー名/あなたのリポジトリ名/main/kanken4kyu_kanji.json';
        const GITHUB_YOJI_JSON_URL = 'https://raw.githubusercontent.com/あなたのユーザー名/あなたのリポジトリ名/main/kanken4kyu_yojijukugo.json';

        // アプリ内で使う全カテゴリーデータを保持するオブジェクト
        let KANJI_MASTER_DATA = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };

        let currentCategoryQuestions = [];
        let questionIdx = 0;
        let correctCount = 0;
        let missCount = 0;
        let canAnswer = true;

        // ページ読み込み時にGitHubからJSONデータを取得
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                // 1. 漢字データの読み込み (カテゴリー 1, 2, 5, 6)
                const resKanji = await fetch(GITHUB_KANJI_JSON_URL);
                if (!resKanji.ok) throw new Error('漢字データの取得に失敗しました');
                const kanjiData = await resKanji.json();

                // 2. 四字熟語データの読み込み (カテゴリー 3, 4)
                const resYoji = await fetch(GITHUB_YOJI_JSON_URL);
                if (!resYoji.ok) throw new Error('四字熟語データの取得に失敗しました');
                const yojiData = await resYoji.json();

                // 各カテゴリー(1〜6)にデータをマッピング
                for (let key in KANJI_MASTER_DATA) {
                    if (kanjiData[key]) KANJI_MASTER_DATA[key] = kanjiData[key];
                    if (yojiData[key]) KANJI_MASTER_DATA[key] = yojiData[key];
                }

                // 読み込みが成功したらUIを有効化
                document.getElementById('load-status').innerText = 'やりたいカテゴリーのボタンをおしてね！';
                for (let i = 1; i <= 6; i++) {
                    document.getElementById(`btn-cat-${i}`).disabled = false;
                }
            } catch (error) {
                console.error(error);
                document.getElementById('load-status').innerText = 'データの読み込みに失敗しました。URLを確認してください。';
                document.getElementById('load-status').style.color = '#dc3545';
            }
        });

        function initQuiz(catNum) {
            let data = KANJI_MASTER_DATA[catNum];
            if (!data || data.length === 0) {
                alert('このカテゴリーのデータが空、または正しく読み込まれていません。');
                return;
            }
            
            // 20問に満たない初期テストデータ状態のときは自動でループ補填（エラー防止設計）
            let tempPool = JSON.parse(JSON.stringify(data));
            while (tempPool.length < 20) {
                tempPool = tempPool.concat(JSON.parse(JSON.stringify(data)));
            }
            
            // ランダムシャッフルして厳密に20問を抽出
            currentCategoryQuestions = tempPool.sort(() => Math.random() - 0.5).slice(0, 20);
            
            questionIdx = 0;
            correctCount = 0;
            missCount = 0;

            document.getElementById('score-correct').innerText = "0";
            document.getElementById('score-miss').innerText = "0";
            document.getElementById('view-start').classList.add('hidden');
            document.getElementById('view-quiz').classList.remove('hidden');
            
            renderQuestion();
        }

        function renderQuestion() {
            canAnswer = true;
            const q = currentCategoryQuestions[questionIdx];
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('current-idx').innerText = questionIdx + 1;
            
            // 正解とひっかけ（3択）を合流させて毎回シャッフル
            let choices = [q.a, ...q.d].sort(() => Math.random() - 0.5);
            currentCategoryQuestions[questionIdx].shuffled = choices;

            choices.forEach((choice, i) => {
                const btn = document.getElementById(`choice-${i}`);
                btn.innerText = choice;
                btn.className = 'choice-btn'; // スタイル初期化
            });
        }

        function checkAnswer(selectedIdx) {
            if (!canAnswer) return;
            canAnswer = false;

            const q = currentCategoryQuestions[questionIdx];
            const selectedAnswer = q.shuffled[selectedIdx];
            const isCorrect = (selectedAnswer === q.a);

            const clickedBtn = document.getElementById(`choice-${selectedIdx}`);
            
            if (isCorrect) {
                clickedBtn.classList.add('correct-ans');
                correctCount++;
                document.getElementById('score-correct').innerText = correctCount;
            } else {
                clickedBtn.classList.add('incorrect-ans');
                missCount++;
                document.getElementById('score-miss').innerText = missCount;
                
                // ミスしたときは、生徒にどこが正解だったのかを視覚的に明示
                q.shuffled.forEach((choice, i) => {
                    if (choice === q.a) {
                        document.getElementById(`choice-${i}`).classList.add('correct-ans');
                    }
                });
            }

            // 1.2秒後に自動で次の問題へ
            setTimeout(() => {
                questionIdx++;
                if (questionIdx < 20) {
                    renderQuestion();
                } else {
                    showResult();
                }
            }, 1200);
        }

        function showResult() {
            document.getElementById('view-quiz').classList.add('hidden');
            document.getElementById('view-result').classList.remove('hidden');
            document.getElementById('final-score').innerText = correctCount;

            const comment = document.getElementById('result-comment');
            if (correctCount === 20) {
                comment.innerText = "完ぺき！パーフェクト！漢検ごうかく間違いなしだね！";
            } else if (correctCount >= 14) {
                comment.innerText = "ごうかくラインをクリア！このちょうしで本番もがんばろう！";
            } else {
                comment.innerText = "もういちどチャレンジして、次は満点をめざそう！";
            }
        }

        function backToMenu() {
            document.getElementById('view-result').classList.add('hidden');
            document.getElementById('view-start').classList.remove('hidden');
        }
    </script>
</body>
</html>

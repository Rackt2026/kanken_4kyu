<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢検4級チャレンジ！ - まなびやつばめ</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #EBF2FF;
            --card: #ffffff;
            --main-yellow: #FFD93D;
            --main-purple: #9472e8;
            --correct: #FF6B6B;
            --wrong: #4A90E2;
            --text: #2c3e50;
        }

        body {
            margin: 0;
            padding: 10px;
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-card {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-radius: 35px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
            min-height: 620px;
            display: flex;
            flex-direction: column;
        }

        /* ロゴ・タイトル */
        .logo { width: 100px; height: 100px; border-radius: 50%; margin-bottom: 10px; border: 3px solid var(--main-yellow); }
        h1 { font-family: 'M PLUS Rounded 1c'; color: var(--text); font-size: 24px; margin: 5px 0; }
        .sub-copy { font-size: 14px; color: #888; margin-bottom: 20px; }

        /* メニューボタン */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn {
            padding: 20px 10px;
            border: none;
            border-radius: 18px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            color: #fff;
            box-shadow: 0 5px 0 rgba(0,0,0,0.1);
        }
        .btn-y { background: var(--main-yellow); color: #5a4b00; }
        .btn-p { background: var(--main-purple); }
        .btn:active { transform: translateY(3px); box-shadow: none; }

        /* クイズ画面 */
        #quiz-view { display: none; flex-direction: column; height: 100%; }
        .status-bar { display: flex; justify-content: space-around; background: #f0f4f8; padding: 10px; border-radius: 15px; font-weight: bold; margin-bottom: 15px; }
        .q-box { 
            background: #fdfdfd; 
            border: 3px solid #eee; 
            border-radius: 20px; 
            padding: 35px 15px; 
            margin: 10px 0; 
            font-size: 36px; 
            font-weight: bold; 
            color: var(--text);
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
        }
        .q-sub { font-size: 16px; color: #666; margin-bottom: 10px; }

        .choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: auto; }
        .choice {
            background: #fff;
            border: 2px solid #e0e6ed;
            padding: 22px 10px;
            border-radius: 18px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        /* 演出 */
        #effect-layer {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 150px;
            pointer-events: none;
            z-index: 100;
            display: none;
            font-family: 'M PLUS Rounded 1c';
        }
        .ani-pop { animation: pop 0.6s ease-out; }
        @keyframes pop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        .hidden { display: none !important; }
        .home-btn { background: #d1d8e0; color: #555; margin-top: 15px; font-size: 14px; padding: 10px; }
    </style>
</head>
<body>

    <div class="app-card">
        <div id="effect-layer"></div>

        <div id="start-view" style="text-align: center;">
            <a href="https://manabiya-tsubame.com/" target="_blank">
                <img src="rogo.png" class="logo" alt="ロゴ" onerror="this.src='https://via.placeholder.com/100?text=LOGO'">
            </a>
            <h1>漢検4級 対策問題</h1>
            <p class="sub-copy">めざせ！20問 全問せいかい！</p>
            
            <div class="menu-grid">
                <button class="btn btn-y" onclick="startQuiz(1)">① 漢字の読み</button>
                <button class="btn btn-p" onclick="startQuiz(2)">② 漢字の書取</button>
                <button class="btn btn-y" onclick="startQuiz(3)">③ 四字熟語読み</button>
                <button class="btn btn-p" onclick="startQuiz(4)">④ 四字熟語書取</button>
                <button class="btn btn-y" onclick="startQuiz(5)">⑤ 対義・類義語</button>
                <button class="btn btn-p" onclick="startQuiz(6)">⑥ 部首・部首名</button>
            </div>
        </div>

        <div id="quiz-view">
            <div class="status-bar">
                <div style="color:var(--correct)">〇 <span id="count-ok">0</span></div>
                <div id="progress">1 / 20</div>
                <div style="color:var(--wrong)">× <span id="count-ng">0</span></div>
            </div>
            
            <div id="q-category-label" class="q-sub">読み方をえらぼう</div>
            <div class="q-box" id="q-text">漢字</div>

            <div class="choices-grid" id="choices-area">
                </div>

            <button class="btn home-btn" onclick="location.reload()">トップにもどる</button>
        </div>
    </div>

    <script>
        let kanjiData = [];
        let yojiData = [];
        let currentQuestions = [];
        let qIndex = 0, ok = 0, ng = 0;

        // 音の生成 (AudioContext)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(freqs) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine';
            let now = audioCtx.currentTime;
            freqs.forEach((f, i) => {
                osc.frequency.setValueAtTime(f, now + i * 0.1);
            });
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(); osc.stop(now + 0.3);
        }

        // CSVの読み込み
        async function loadCSV() {
            try {
                const r1 = await fetch('kanken4kyu_kanji.csv');
                const t1 = await r1.text();
                kanjiData = t1.split('\n').slice(1).filter(l => l.includes(',')).map(l => l.split(','));

                const r2 = await fetch('kanken4kyu_yojijukugo.csv');
                const t2 = await r2.text();
                yojiData = t2.split('\n').slice(1).filter(l => l.includes(',')).map(l => l.split(','));
            } catch (e) {
                console.error("CSV load error", e);
            }
        }

        function startQuiz(cat) {
            if (kanjiData.length === 0) return alert("データをよみこみ中だよ！");
            
            ok = 0; ng = 0; qIndex = 0;
            document.getElementById('start-view').classList.add('hidden');
            document.getElementById('quiz-view').style.display = 'flex';
            
            generateProblemSet(cat);
            showQuestion();
        }

        function generateProblemSet(cat) {
            currentQuestions = [];
            let source = (cat <= 2 || cat === 6) ? kanjiData : yojiData;
            let shuffle = [...source].sort(() => Math.random() - 0.5);

            for (let i = 0; i < 20; i++) {
                let item = shuffle[i];
                let q = "", a = "", label = "", pool = [];

                if (cat === 1) { // 漢字読み
                    q = item[0]; a = item[1] || item[2]; label = "読み方をえらぼう";
                    pool = source.map(x => x[1] || x[2]);
                } else if (cat === 2) { // 漢字書き
                    q = item[1] || item[2]; a = item[0]; label = "正しい漢字をえらぼう";
                    pool = source.map(x => x[0]);
                } else if (cat === 3) { // 四字熟語読み
                    q = item[0]; a = item[1]; label = "四字熟語の読み方は？";
                    pool = source.map(x => x[1]);
                } else if (cat === 4) { // 四字熟語書き
                    q = item[2]; a = item[0]; label = "意味にあう四字熟語は？";
                    pool = source.map(x => x[0]);
                } else if (cat === 5) { // 対義・類義
                    q = "意味: " + item[2].substring(0,15) + "..."; a = item[0]; label = "この意味の熟語は？";
                    pool = source.map(x => x[0]);
                } else { // 部首 (※CSVに部首がないので漢字を出すサンプル)
                    q = item[0]; a = "部首A"; label = "この漢字の部首は？";
                    pool = ["にんべん", "さんずい", "きへん", "ごんべん", "いとへん"];
                }

                // 4択作成
                let choices = [a];
                while(choices.length < 4) {
                    let dummy = pool[Math.floor(Math.random() * pool.length)];
                    if(dummy && !choices.includes(dummy)) choices.push(dummy);
                }
                currentQuestions.push({ q, a, label, c: choices.sort(() => Math.random() - 0.5) });
            }
        }

        function showQuestion() {
            const data = currentQuestions[qIndex];
            document.getElementById('progress').innerText = `${qIndex + 1} / 20`;
            document.getElementById('q-category-label').innerText = data.label;
            document.getElementById('q-text').innerText = data.q;
            document.getElementById('count-ok').innerText = ok;
            document.getElementById('count-ng').innerText = ng;

            const area = document.getElementById('choices-area');
            area.innerHTML = '';
            data.c.forEach(txt => {
                const b = document.createElement('button');
                b.className = 'choice';
                b.innerText = txt;
                b.onclick = () => checkAnswer(txt, data.a);
                area.appendChild(b);
            });
        }

        function checkAnswer(select, correct) {
            const isCorrect = (select === correct);
            const el = document.getElementById('effect-layer');
            el.style.display = 'block';
            el.innerText = isCorrect ? "〇" : "×";
            el.style.color = isCorrect ? var(--correct) : var(--wrong);
            el.className = 'ani-pop';
            
            if(isCorrect) {
                ok++; playSfx([880, 1100]); 
            } else {
                ng++; playSfx([220, 180]);
            }

            setTimeout(() => {
                el.style.display = 'none';
                el.className = '';
                qIndex++;
                if(qIndex < 20) showQuestion();
                else alert(`終了！\n正解: ${ok}問 / ミス: ${ng}問`);
            }, 700);
        }

        loadCSV();
    </script>
</body>
</html>

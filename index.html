<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>漢検4級チャレンジ！ - まなびやつばめ</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #EBF2FF;
            --card: #ffffff;
            --main-yellow: #FFD93D;
            --main-purple: #9472e8;
            --btn-shadow-y: #E5C330;
            --btn-shadow-p: #7555C2;
            --correct: #FF6B6B;
            --wrong: #4A90E2;
            --text: #2c3e50;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 15px;
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-card {
            width: 100%;
            max-width: 450px;
            background: var(--card);
            border-radius: 35px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            position: relative;
            min-height: 580px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ロゴ・タイトル */
        .logo-area { text-align: center; margin-bottom: 10px; }
        .logo { width: 90px; height: 90px; border-radius: 50%; border: 4px solid var(--main-yellow); box-shadow: 0 5px 10px rgba(0,0,0,0.05); }
        h1 { font-family: 'M PLUS Rounded 1c'; font-weight: 900; color: var(--text); font-size: 26px; margin: 10px 0 5px 0; text-align: center; }
        .sub-copy { font-size: 14px; color: #7f8c8d; margin: 0 0 20px 0; font-weight: bold; text-align: center; }

        /* グリッドメニュー */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; }
        
        .btn {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            padding: 18px 8px;
            border: none;
            border-radius: 20px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .btn-y { background: var(--main-yellow); color: #5a4b00; box-shadow: 0 6px 0 var(--btn-shadow-y); }
        .btn-p { background: var(--main-purple); box-shadow: 0 6px 0 var(--btn-shadow-p); }
        
        /* スマホで押したときの感触 */
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.1);
        }

        /* クイズ画面 */
        #quiz-view, #result-view { display: none; flex-direction: column; height: 100%; flex-grow: 1; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; background: #f1f5f9; padding: 12px 20px; border-radius: 18px; font-weight: bold; font-size: 16px; margin-bottom: 15px; }
        
        .q-sub { font-size: 14px; color: #7f8c8d; font-weight: bold; margin-bottom: 5px; text-align: left; padding-left: 5px; }
        .q-box { 
            background: #f8fafc; 
            border: 3px dashed #cbd5e1; 
            border-radius: 24px; 
            padding: 30px 15px; 
            margin-bottom: 20px; 
            font-size: 34px; 
            font-weight: 700; 
            color: var(--text);
            min-height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.3;
        }

        /* 4択ボタン */
        .choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: auto; }
        .choice-btn {
            background: #fff;
            border: 2px solid #e2e8f0;
            padding: 18px 10px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            color: var(--text);
            cursor: pointer;
            box-shadow: 0 4px 0 #e2e8f0;
            transition: all 0.1s;
        }
        .choice-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.1);
            background: #f8fafc;
        }

        /* 丸バツアニメーション */
        #effect-layer {
            position: absolute;
            top: 45%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 160px;
            font-weight: bold;
            pointer-events: none;
            z-index: 100;
            opacity: 0;
        }
        .ani-pop { animation: popEffect 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popEffect {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            40% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
        }

        .home-btn { background: #94a3b8; color: white; margin-top: 20px; padding: 12px; font-size: 14px; border-radius: 15px; width: 100%; box-shadow: 0 4px 0 #64748b; }
        .home-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.1); }
        
        /* リザルト画面 */
        .result-score { font-size: 24px; font-weight: bold; margin: 20px 0; color: var(--text); }
        .result-comment { font-size: 18px; color: var(--main-purple); font-weight: bold; margin-bottom: 30px; font-family: 'M PLUS Rounded 1c'; }

        .hidden { display: none !important; }
        .loading-text { font-size: 14px; color: #e67e22; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="app-card">
        <div id="effect-layer"></div>

        <div id="start-view">
            <div class="logo-area">
                <a href="https://manabiya-tsubame.com/" target="_blank">
                    <img src="rogo.png" class="logo" alt="つばめロゴ" onerror="this.src='https://via.placeholder.com/100?text=つばめ'">
                </a>
            </div>
            <h1>漢検4級チャレンジ</h1>
            <p class="sub-copy" id="loading-status">データをよみこみ中...</p>
            
            <div class="menu-grid">
                <button class="btn btn-y" onclick="tryStartQuiz(1)">① 漢字の読み</button>
                <button class="btn btn-p" onclick="tryStartQuiz(2)">② 漢字の書取</button>
                <button class="btn btn-y" onclick="tryStartQuiz(3)">③ 四字熟語読み</button>
                <button class="btn btn-p" onclick="tryStartQuiz(4)">④ 四字熟語書取</button>
                <button class="btn btn-y" onclick="tryStartQuiz(5)">⑤ 対義・類義語</button>
                <button class="btn btn-p" onclick="tryStartQuiz(6)">⑥ 部首・部首名</button>
            </div>
        </div>

        <div id="quiz-view">
            <div>
                <div class="status-bar">
                    <div style="color:var(--correct)">〇 <span id="count-ok">0</span></div>
                    <div id="progress" style="font-family:'M PLUS Rounded 1c'; font-size:18px;">1 / 20</div>
                    <div style="color:var(--wrong)">× <span id="count-ng">0</span></div>
                </div>
                <div id="q-category-label" class="q-sub">モンダイ</div>
                <div class="q-box" id="q-text">---</div>
            </div>

            <div class="choices-grid" id="choices-area"></div>
            <button class="btn home-btn" onclick="backToHome()">トップにもどる</button>
        </div>

        <div id="result-view">
            <h1>テストしゅうりょう！</h1>
            <div class="result-score">せいかい数: <span id="final-score" style="color:var(--correct); font-size:40px;">0</span> / 20 問</div>
            <div class="result-comment" id="result-comment">がんばったね！</div>
            <button class="btn btn-y" style="width:100%; font-size:18px;" onclick="backToHome()">もういちど遊ぶ</button>
        </div>
    </div>

    <script>
        let kanjiData = [];
        let yojiData = [];
        let currentQuestions = [];
        let qIndex = 0, ok = 0, ng = 0;
        let isDataLoaded = false;
        let audioCtx = null;

        // スマホの音声ロック解除を兼ねたサウンド再生機能
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSfx(freqs) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                let now = audioCtx.currentTime;
                freqs.forEach((f, i) => {
                    osc.frequency.setValueAtTime(f, now + i * 0.1);
                });
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start();
                osc.stop(now + 0.3);
            } catch(e) { console.log("Audio error suppressed"); }
        }

        // CSVパース（カンマや空白のブレに強い高耐久ロジック）
        function parseCSV(text) {
            return text.split(/\r?\n/).slice(1).filter(line => line.trim() !== '').map(line => {
                return line.split(',').map(cell => cell.trim());
            }).filter(cells => cells.length >= 2);
        }

        // CSVファイルの非同期読み込み
        async function loadCSVData() {
            try {
                const r1 = await fetch('kanken4kyu_kanji.csv');
                if(!r1.ok) throw new Error();
                const t1 = await r1.text();
                kanjiData = parseCSV(t1);

                const r2 = await fetch('kanken4kyu_yojijukugo.csv');
                if(!r2.ok) throw new Error();
                const t2 = await r2.text();
                yojiData = parseCSV(t2);

                isDataLoaded = true;
                document.getElementById('loading-status').innerText = "めざせ！20問 全問せいかい！";
                document.getElementById('loading-status').style.color = "#7f8c8d";
            } catch (e) {
                document.getElementById('loading-status').innerText = "⚠️データ読み込みに失敗しました。配置を確認してください。";
                document.getElementById('loading-status').style.color = "red";
            }
        }

        function tryStartQuiz(cat) {
            // スマホのWebAudio解放
            initAudio();
            if (!isDataLoaded) {
                alert("現在データをよみこんでいます。数秒待ってからもう一度おしてください！");
                return;
            }
            startQuiz(cat);
        }

        function startQuiz(cat) {
            ok = 0; ng = 0; qIndex = 0;
            document.getElementById('start-view').classList.add('hidden');
            document.getElementById('result-view').style.display = 'none';
            document.getElementById('quiz-view').style.display = 'flex';
            
            generateProblemSet(cat);
            showQuestion();
        }

        function generateProblemSet(cat) {
            currentQuestions = [];
            // カテゴリー5は四字熟語、カテゴリー6は部首(漢字データを使用)
            let source = (cat === 1 || cat === 2 || cat === 6) ? kanjiData : yojiData;
            let shuffle = [...source].sort(() => Math.random() - 0.5);
            let maxQuestions = Math.min(20, shuffle.length);

            for (let i = 0; i < maxQuestions; i++) {
                let item = shuffle[i];
                let q = "", a = "", label = "", pool = [];

                if (cat === 1) { 
                    q = item[0]; a = item[1] || "なし"; label = "正しい読み方をえらぼう";
                    pool = source.map(x => x[1]).filter(Boolean);
                } else if (cat === 2) { 
                    q = item[1] || "なし"; a = item[0]; label = "読み方に合う漢字をえらぼう";
                    pool = source.map(x => x[0]).filter(Boolean);
                } else if (cat === 3) { 
                    q = item[0]; a = item[1] || "なし"; label = "四字熟語の読み方をえらぼう";
                    pool = source.map(x => x[1]).filter(Boolean);
                } else if (cat === 4) { 
                    // 意味説明から出題して四字熟語を当てさせる
                    q = item[2] ? item[2].substring(0, 45) : "意味データなし"; a = item[0]; label = "意味に合う四字熟語をえらぼう";
                    pool = source.map(x => x[0]).filter(Boolean);
                } else if (cat === 5) { 
                    // 対義語・類義語の簡易模倣（意味から探す形式）
                    q = item[2] ? "「" + item[2].substring(0, 30) + "」に近い熟語は？" : "熟語をえらぼう"; a = item[0]; label = "対義語・類義語トレーニング";
                    pool = source.map(x => x[0]).filter(Boolean);
                } else { 
                    // 部首クイズ（漢字の音読みをベースにしたダミー難易度調整）
                    q = item[0]; a = item[1] ? item[1].substring(0,2) + "の仲間" : "訓読みの仲間"; label = "この漢字とグループが同じなのは？";
                    pool = source.map(x => x[1] ? x[1].substring(0,2) + "の仲間" : "訓読みの仲間").filter(Boolean);
                }

                // 4択生成（重複を排除）
                let choices = [a];
                let attempts = 0;
                while(choices.length < 4 && attempts < 100) {
                    attempts++;
                    let dummy = pool[Math.floor(Math.random() * pool.length)];
                    if(dummy && !choices.includes(dummy)) choices.push(dummy);
                }
                // 万が一4つ集まらなかった場合のセーフティ
                while(choices.length < 4) { choices.push("ダミー" + choices.length); }

                currentQuestions.push({ q, a, label, c: choices.sort(() => Math.random() - 0.5) });
            }
        }

        function showQuestion() {
            const data = currentQuestions[qIndex];
            document.getElementById('progress').innerText = `${qIndex + 1} / 20`;
            document.getElementById('q-category-label').innerText = data.label;
            document.getElementById('q-text').innerText = data.q;
            document.getElementById('count-ok').innerText = ok;
            document.getElementById('count-ng').innerText = ng;

            const area = document.getElementById('choices-area');
            area.innerHTML = '';
            
            data.c.forEach(txt => {
                const b = document.createElement('button');
                b.className = 'choice-btn';
                b.innerText = txt;
                // スマホのダブルタップズーム防止および即時反応のためにonclickを使用
                b.onclick = () => checkAnswer(txt, data.a);
                area.appendChild(b);
            });
        }

        function checkAnswer(select, correct) {
            const isCorrect = (select === correct);
            const el = document.getElementById('effect-layer');
            
            // アニメーションのリセットと適用
            el.style.display = 'block';
            el.innerText = isCorrect ? "〇" : "×";
            el.style.color = isCorrect ? "var(--correct)" : "var(--wrong)";
            el.className = '';
            void el.offsetWidth; // 強制リフロー
            el.className = 'ani-pop';
            
            if(isCorrect) {
                ok++; 
                playSfx([523.25, 659.25, 783.99, 1046.50]); // ドミソド（ファンファーレ）
            } else {
                ng++; 
                playSfx([293.66, 277.18, 261.63]); // ブブー（低音減少）
            }

            setTimeout(() => {
                el.style.display = 'none';
                qIndex++;
                if(qIndex < currentQuestions.length) {
                    showQuestion();
                } else {
                    showResult();
                }
            }, 700);
        }

        function showResult() {
            document.getElementById('quiz-view').style.display = 'none';
            document.getElementById('result-view').style.display = 'flex';
            document.getElementById('final-score').innerText = ok;

            let comment = "つぎは全問せいかいをめざそう！";
            if(ok === 20) comment = "すごすぎる！かんぺきな天才だね！💮";
            else if(ok >= 15) comment = "すばらしい！合格ラインクリアだよ！✨";
            else if(ok >= 10) comment = "その調子！くり返し練習してみよう！👍";
            
            document.getElementById('result-comment').innerText = comment;
        }

        function backToHome() {
            document.getElementById('quiz-view').style.display = 'none';
            document.getElementById('result-view').style.display = 'none';
            document.getElementById('start-view').classList.remove('hidden');
            document.getElementById('loading-status').innerText = "めざせ！20問 全問せいかい！";
        }

        // 即時読み込み開始
        loadCSVData();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢検4級 学習リスト</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 20px; background-color: #f4f4f9; }
        h1 { color: #333; }
        h2 { border-left: 5px solid #0056b3; padding-left: 10px; color: #0056b3; margin-top: 40px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; background-color: #fff; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #0056b3; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .container { max-width: 1000px; margin: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>漢検4級 学習リスト</h1>

        <h2>漢字リスト</h2>
        <table>
            <thead>
                <tr><th>漢字</th><th>音読み</th><th>訓読み</th></tr>
            </thead>
            <tbody>
                <tr><td>一</td><td>イチ・イツ</td><td>ひと・ひと（つ）</td></tr>
                <tr><td>右</td><td>ウ・ユウ</td><td>みぎ</td></tr>
                </tbody>
        </table>

        <h2>四字熟語リスト</h2>
        <table>
            <thead>
                <tr><th>四字熟語</th><th>よみがな</th><th>意味説明</th><th>構成タイプ</th></tr>
            </thead>
            <tbody>
                <tr><td>悪衣悪食</td><td>あくいあくしょく</td><td>粗末な衣服と粗末な食事。貧しく不自由な生活のたとえ</td><td>ア（同じような意味の重ね）</td></tr>
                </tbody>
        </table>
    </div>
</body>
</html>

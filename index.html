const bushuGroups={"にんべん":["ぎょうにんべん","りっしんべん","てへん","ごんべん"],"さんずい":["にすい","りっしんべん","てへん","きへん"],"きへん":["のぎへん","くさかんむり","たけかんむり","さんずい"],"ごんべん":["にんべん","りっしんべん","てへん","さんずい"],"いとへん":["ころもへん","しめすへん","さんずい","てへん"],"てへん":["にんべん","りっしんべん","さんずい","きへん"],"くさかんむり":["たけかんむり","うかんむり","きへん","のぎへん"],"うかんむり":["あなかんむり","わかんむり","くさかんむり","まだれ"],"しんにょう":["ぎょうにんべん","こざとへん","おおざと"],"くちへん":["口","ごんべん","にんべん","さんずい"],"つちへん":["土","にんべん","さんずい","きへん"],"こざとへん":["おおざと","しんにょう","ぎょうにんべん","にんべん"],"りっしんべん":["心","にんべん","てへん","さんずい"],"のぎへん":["きへん","米","たけかんむり","くさかんむり"],"たけかんむり":["くさかんむり","のぎへん","うかんむり","きへん"],"かねへん":["金","石","王","貝"],"にくづき":["月","目","心","さんずい"],"まだれ":["がんだれ","うかんむり","やまいだれ"],"もんがまえ":["くにがまえ","はこがまえ","うかんむり"]};
const allBushu=Array.from(new Set([...fallbackKanji.map(x=>x.b),...Object.values(bushuGroups).flat()])).filter(Boolean);
function normalizeText(t){return String(t||"").replace(/^\uFEFF/,"").trim()}function toHiragana(t){return normalizeText(t).replace(/[ァ-ン]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-96)).replace(/[\s　]+/g,"").replace(/[・,、／/].*$/g,"")}
function splitCSVLine(line){const cells=[];let cur="",q=false;for(let i=0;i<line.length;i++){const ch=line[i],n=line[i+1];if(ch=='"'&&q&&n=='"'){cur+='"';i++}else if(ch=='"'){q=!q}else if(ch==","&&!q){cells.push(normalizeText(cur));cur=""}else cur+=ch}cells.push(normalizeText(cur));return cells}
function findField(obj,cells,keys,i){for(const k of Object.keys(obj)){if(keys.some(x=>k.toLowerCase().includes(x.toLowerCase())))return normalizeText(obj[k])}return normalizeText(cells[i]||"")}
function parseCSV(text,type){const lines=String(text||"").split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];const first=splitCSVLine(lines[0]);const hasHead=first.some(c=>/漢字|読み|よみ|四字|意味|部首|音読み|訓読み|onyomi|kunyomi/i.test(c));const headers=hasHead?first:[];const body=hasHead?lines.slice(1):lines;return body.map(line=>{const cells=splitCSVLine(line),obj={};headers.forEach((h,i)=>obj[h]=cells[i]||"");if(type=="kanji")return{k:findField(obj,cells,["漢字","問題","kanji","word"],0),r:findField(obj,cells,["読み","よみ","reading"],1),on:findField(obj,cells,["音読み","音","onyomi","on"],2),kun:findField(obj,cells,["訓読み","訓","kunyomi","kun"],3),b:findField(obj,cells,["部首名","部首","bushu"],4)};return{w:findField(obj,cells,["四字","熟語","word"],0),r:findField(obj,cells,["読み","よみ","reading"],1),m:findField(obj,cells,["意味","説明","内容","description"],2)}}).filter(r=>type=="kanji"?r.k:r.w)}
async function loadCSVData(){try{const[kr,yr]=await Promise.all([fetch("kanken4kyu_kanji.csv",{cache:"no-store"}),fetch("kanken4kyu_yojijukugo.csv",{cache:"no-store"})]);if(!kr.ok||!yr.ok)throw Error();const[kt,yt]=await Promise.all([kr.text(),yr.text()]);const kanji=parseCSV(kt,"kanji").map(r=>({...r,on:toHiragana(r.on||r.r),kun:toHiragana(r.kun||r.r),r:toHiragana(r.r||r.on||r.kun)})).filter(r=>r.k&&(r.on||r.kun));const yoji=parseCSV(yt,"yoji").map(r=>({...r,r:toHiragana(r.r)})).filter(r=>r.w&&r.r);if(kanji.length<10||yoji.length<5)throw Error();state.kanji=kanji;state.yoji=yoji;state.loaded=true;el.loadingStatus.textContent=`データOK：漢字 ${kanji.length}件／四字熟語 ${yoji.length}件`}catch(e){state.kanji=fallbackKanji;state.yoji=fallbackYoji;state.loaded=true;el.loadingStatus.textContent=`内蔵データで起動中：漢字 ${state.kanji.length}件／四字熟語 ${state.yoji.length}件`}}
function initAudio(){try{if(!state.audioCtx)state.audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(state.audioCtx.state=="suspended")state.audioCtx.resume()}catch(e){state.audioCtx=null}}
function playTone(seq,type="sine"){if(!state.audioCtx)return;const ctx=state.audioCtx,now=ctx.currentTime;seq.forEach(item=>{const osc=ctx.createOscillator(),g=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(item.freq,now+item.start);g.gain.setValueAtTime(.0001,now+item.start);g.gain.exponentialRampToValueAtTime(item.volume||.08,now+item.start+.01);g.gain.exponentialRampToValueAtTime(.0001,now+item.start+item.duration);osc.connect(g);g.connect(ctx.destination);osc.start(now+item.start);osc.stop(now+item.start+item.duration+.02)})}
function playCorrect(){playTone([{freq:523.25,start:0,duration:.11},{freq:659.25,start:.09,duration:.11},{freq:783.99,start:.18,duration:.11},{freq:1046.5,start:.27,duration:.16,volume:.09}])}function playWrong(){playTone([{freq:180,start:0,duration:.16,volume:.09},{freq:135,start:.12,duration:.2,volume:.08}],"sawtooth")}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function sample(a,n){return shuffle(a).slice(0,n)}function unique(a){return Array.from(new Set(a.map(v=>normalizeText(v)).filter(Boolean)))}function addDummies(correct,cands,n=4){const r=[correct];for(const c of cands){if(r.length>=n)break;if(c&&c!==correct&&!r.includes(c))r.push(c)}return shuffle(r).slice(0,n)}
function similarKanaDummies(correct,pool){const c=toHiragana(correct),f=c[0],l=c.slice(-1),len=c.length;return unique(pool).filter(x=>x!==c).map(x=>{const s=toHiragana(x);let score=0;if(s[0]===f)score+=4;if(s.slice(-1)===l)score+=3;if(Math.abs(s.length-len)<=1)score+=2;if(s.slice(0,2)===c.slice(0,2))score+=3;if(s.includes(f))score++;return{x:s,score}}).sort((a,b)=>b.score-a.score||Math.random()-.5).map(o=>o.x)}
function similarKanjiDummies(correct,pool){const chars=[...correct];return unique(pool).filter(x=>x!==correct).map(x=>{let score=0;for(const ch of chars)if(x.includes(ch))score+=3;if([...x].length===chars.length)score++;if(x[0]===correct[0])score+=2;return{x,score}}).sort((a,b)=>b.score-a.score||Math.random()-.5).map(o=>o.x)}
function fakeYojiDummies(correct,pool){const chars=[...correct],real=similarKanjiDummies(correct,pool),rep=unique(pool.join("").split("")).filter(ch=>!chars.includes(ch)),fakes=[];for(let i=0;i<20&&fakes.length<8;i++){const pos=Math.floor(Math.random()*chars.length),copy=[...chars];copy[pos]=rep[Math.floor(Math.random()*rep.length)]||"心";const fake=copy.join("");if(fake!==correct&&!fakes.includes(fake))fakes.push(fake)}return unique([...real,...fakes])}
function makeReadingQuestion(row,mode){const a=toHiragana(mode=="kun"?row.kun:row.on),pool=state.kanji.map(r=>toHiragana(mode=="kun"?r.kun:r.on)).filter(Boolean),modeLabel=mode=="kun"?"訓読み":"音読み";return{q:row.k,a,label:`${modeLabel}をえらぼう`,hint:`これは「${modeLabel}」の問題です。選択肢はすべてひらがなです。`,choices:addDummies(a,similarKanaDummies(a,pool)),choiceClass:"reading-choice"}}
function makeWritingQuestion(row){const q=toHiragana(row.r||row.on||row.kun),a=row.k,poolRows=state.kanji.filter(r=>{if(r.k===a)return false;return !unique([r.r,r.on,r.kun].map(toHiragana)).includes(q)});return{q,a,label:"読み方に合う漢字をえらぼう",hint:"同じ読みで正解になりそうな漢字は選択肢から外しています。",choices:addDummies(a,similarKanjiDummies(a,poolRows.map(r=>r.k))),choiceClass:"big-kanji"}}
function makeYojiReadingQuestion(row){return{q:row.w,a:row.r,label:"四字熟語の読み方をえらぼう",hint:"四字熟語は、漢字の並びと読み方をセットで覚えましょう。",choices:addDummies(row.r,similarKanaDummies(row.r,state.yoji.map(x=>x.r))),choiceClass:"reading-choice"}}
function makeYojiWritingQuestion(row){return{q:row.m||`「${row.r}」と読む四字熟語はどれ？`,a:row.w,label:"意味に合う四字熟語をえらぼう",hint:"意味を読んで、いちばん合う四字熟語をえらびましょう。",choices:addDummies(row.w,fakeYojiDummies(row.w,state.yoji.map(x=>x.w))),small:true}}
function makeSynonymQuestion(p){const correct=p.a,same=synonymPairs.filter(x=>x.kind===p.kind&&x.a!==correct).map(x=>x.a),rel=synonymPairs.filter(x=>x.q!==p.q&&x.a!==correct).flatMap(x=>[x.q,x.a]);return{q:`「${p.q}」と${p.kind}の言葉はどれ？`,a:correct,label:"近い意味・反対の意味を考えよう",hint:"意味が近いのか、反対なのかを見てえらびましょう。",choices:addDummies(correct,unique([...same,...similarKanjiDummies(correct,rel)])),small:true}}
function makeBushuQuestion(row){const a=row.b||"にんべん",cands=unique([...(bushuGroups[a]||[]),...allBushu]).filter(x=>x!==a);return{q:row.k,a,label:"部首名をえらぼう",hint:`漢字「${row.k}」の部首名をえらびましょう。似た形の部首にも注意。`,choices:addDummies(a,cands)}}
function generateQuestions(cat){let q=[];if(cat=="reading"){q=shuffle([...sample(state.kanji.filter(r=>r.on),10).map(r=>makeReadingQuestion(r,"on")),...sample(state.kanji.filter(r=>r.kun),10).map(r=>makeReadingQuestion(r,"kun"))])}if(cat=="writing")q=sample(state.kanji,TOTAL_QUESTIONS).map(makeWritingQuestion);if(cat=="yojiReading")q=sample(state.yoji,TOTAL_QUESTIONS).map(makeYojiReadingQuestion);if(cat=="yojiWriting")q=sample(state.yoji,TOTAL_QUESTIONS).map(makeYojiWritingQuestion);if(cat=="synonym")q=sample(synonymPairs,TOTAL_QUESTIONS).map(makeSynonymQuestion);if(cat=="bushu")q=sample(state.kanji.filter(r=>r.b),TOTAL_QUESTIONS).map(makeBushuQuestion);while(q.length<TOTAL_QUESTIONS&&q.length>0)q.push(...sample(q,Math.min(q.length,TOTAL_QUESTIONS-q.length)));return q.slice(0,TOTAL_QUESTIONS)}
function setView(name){[el.startView,el.quizView,el.resultView].forEach(v=>v.classList.remove("active"));if(name=="start")el.startView.classList.add("active");if(name=="quiz")el.quizView.classList.add("active");if(name=="result")el.resultView.classList.add("active")}
function startQuiz(cat){initAudio();if(!state.loaded){alert("データを読み込み中です。少し待ってからもう一度おしてください。");return}const qs=generateQuestions(cat);if(!qs.length){alert("このカテゴリーの問題が作れませんでした。");return}state.questions=qs;state.index=0;state.ok=0;state.ng=0;state.locked=false;setView("quiz");showQuestion()}
function showQuestion(){const d=state.questions[state.index];state.locked=false;el.okCount.textContent=state.ok;el.ngCount.textContent=state.ng;el.progress.textContent=`${state.index+1} / ${TOTAL_QUESTIONS}`;el.categoryLabel.textContent=d.label;el.questionBox.textContent=d.q;el.questionBox.classList.toggle("small",!!d.small||String(d.q).length>18);el.hintText.textContent=d.hint||"";el.choicesArea.innerHTML="";d.choices.forEach(choice=>{const b=document.createElement("button");b.className=`choice-btn ${d.choiceClass||""}`.trim();b.type="button";b.textContent=choice;b.addEventListener("click",()=>checkAnswer(choice));el.choicesArea.appendChild(b)})}
function showEffect(ok){el.effectLayer.textContent=ok?"〇":"×";el.effectLayer.style.color=ok?"var(--red)":"var(--bd)";el.effectLayer.className="effect-layer";void el.effectLayer.offsetWidth;el.effectLayer.classList.add("pop")}
function checkAnswer(selected){if(state.locked)return;state.locked=true;const d=state.questions[state.index],ok=selected===d.a;if(ok){state.ok++;playCorrect()}else{state.ng++;playWrong()}showEffect(ok);Array.from(el.choicesArea.children).forEach(btn=>{btn.classList.add("locked");if(btn.textContent===d.a)btn.classList.add("correct-choice");if(!ok&&btn.textContent===selected)btn.classList.add("wrong-choice")});setTimeout(()=>{state.index++;if(state.index<TOTAL_QUESTIONS)showQuestion();else showResult()},760)}
function showResult(){setView("result");el.finalScore.textContent=state.ok;let c="くり返せば、もっと強くなれます！";if(state.ok===20)c="満点！すばらしい集中力です！";else if(state.ok>=17)c="かなり力がついています！";else if(state.ok>=14)c="合格ラインが見えてきました！";else if(state.ok>=10)c="半分以上クリア！ここから伸びます！";el.resultComment.textContent=c;el.resultDetail.textContent=`正解 ${state.ok}問、不正解 ${state.ng}問。まちがえた問題は、次に覚えるチャンスです。`}
function backToHome(){state.locked=false;setView("start")}
document.querySelectorAll("[data-cat]").forEach(b=>b.addEventListener("click",()=>startQuiz(b.dataset.cat)));el.homeBtn.addEventListener("click",backToHome);el.retryBtn.addEventListener("click",backToHome);loadCSVData();
</script>

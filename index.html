<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢検4級対策 - まなびやつばめ</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #EBF2FF; --btn-green: #4fbe79; --btn-purple: #7c5cc4; --navy-dark: #2c3e50; }
        body { margin: 0; padding: 20px; font-family: 'Noto Sans JP', sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; }
        .app-card { width: 100%; max-width: 540px; background: white; border-radius: 30px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .btn-large { width: 100%; padding: 15px; margin-bottom: 10px; border: none; border-radius: 14px; color: white; font-weight: bold; cursor: pointer; }
        .btn-green { background: var(--btn-green); }
        .btn-purple { background: var(--btn-purple); }
        .hidden { display: none; }
        .question-box { font-size: 24px; font-weight: bold; margin: 20px 0; text-align: center; }
        .choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .choice-btn { padding: 20px; border: 2px solid #ddd; border-radius: 15px; cursor: pointer; background: white; }
    </style>
</head>
<body>

<div class="app-card">
    <div id="view-start">
        <h1>漢検4級対策</h1>
        <div class="menu-list">
            <button class="btn-large btn-green" onclick="startQuiz('kanji_read')">① 漢字の読み</button>
            <button class="btn-large btn-purple" onclick="startQuiz('kanji_write')">② 漢字の書取</button>
            <button class="btn-large btn-green" onclick="startQuiz('yoji_read')">③ 四字熟語の読み</button>
            <button class="btn-large btn-purple" onclick="startQuiz('yoji_write')">④ 四字熟語の書取</button>
        </div>
    </div>

    <div id="view-quiz" class="hidden">
        <div id="progress">1 / 20</div>
        <div class="question-box" id="question-text"></div>
        <div class="choices-grid" id="choices"></div>
    </div>
</div>

<script>
    let rawData = { kanji: [], yoji: [] };
    let quizData = [];
    let currentIdx = 0;

    // データ読み込み
    async function loadData() {
        const kRes = await fetch('kanken4kyu_kanji.csv');
        const kText = await kRes.text();
        rawData.kanji = kText.split('\n').slice(1).map(line => {
            const [q, a1, a2] = line.split(',');
            return { q, a1, a2 }; // 漢字, 音読み, 訓読み
        });

        const yRes = await fetch('kanken4kyu_yojijukugo.csv');
        const yText = await yRes.text();
        rawData.yoji = yText.split('\n').slice(1).map(line => {
            const [q, r, m, t] = line.split(',');
            return { q, r, m, t }; // 四字熟語, 読み, 意味, タイプ
        });
    }

    function startQuiz(type) {
        // ここに各カテゴリー別のロジックを実装
        // 読み込みデータからランダムに20問抽出
        document.getElementById('view-start').classList.add('hidden');
        document.getElementById('view-quiz').classList.remove('hidden');
        nextQuestion();
    }

    function nextQuestion() {
        // 次の問題表示ロジック
    }

    loadData();
</script>
</body>
</html>
